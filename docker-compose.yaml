services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electoral-app
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - ./storage:/var/www/example/storage
      - ./bootstrap/cache:/var/www/example/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-electoral}
      - DB_USERNAME=${DB_USERNAME:-electoral}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Purga de archivos que causan el error Collision
        rm -rf bootstrap/cache/*.php

        # Sintonía de permisos en caliente
        chown -R unit:unit /var/www/example/storage /var/www/example/bootstrap/cache

        # Limpieza de Laravel
        php artisan config:clear
        php artisan route:clear

        # Ejecutar el binario original de Unit
        exec unitd --no-daemon --control unix:/var/run/control.unit.sock
    networks:
      - electoral-net

  mysql:
    image: mysql:8.0
    container_name: electoral-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_DATABASE=${DB_DATABASE:-electoral}
      - MYSQL_USER=${DB_USERNAME:-electoral}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - electoral-net

  redis:
    image: redis:alpine
    container_name: electoral-redis
    restart: unless-stopped
    networks:
      - electoral-net

networks:
  electoral-net:
    driver: bridge

volumes:
  mysql-data:
