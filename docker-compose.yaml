services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electoral-app
    restart: unless-stopped
    ports:
      - "8082:8000"
    environment:
      # Solo variables que NO gestiona Coolify automáticamente
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${SERVICE_URL_APP:-http://localhost}
      - APP_DEMO=${APP_DEMO:-false}

      # Base de datos
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-electoral}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}

      # Redis - solo REDIS_HOST, el resto gestiona Coolify o usa defaults
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}

      # FILESYSTEM_DISK no suele gestionar Coolify
      - FILESYSTEM_DISK=local

      # BROADCAST_DRIVER no suele gestionar Coolify
      - BROADCAST_DRIVER=log

      # SESSION_LIFETIME no suele gestionar Coolify
      - SESSION_LIFETIME=120

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - electoral-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: electoral-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-electoral}
      # - MYSQL_USER=${DB_USERNAME:-electoral}
      # - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - electoral-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: electoral-redis
    restart: unless-stopped
    networks:
      - electoral-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electoral-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      - CONTAINER_ROLE=queue
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${SERVICE_URL_APP:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-electoral}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      - mysql
      - redis
    networks:
      - electoral-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electoral-scheduler
    restart: unless-stopped
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${SERVICE_URL_APP:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-electoral}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      - mysql
      - redis
    networks:
      - electoral-net

networks:
  electoral-net:
    driver: bridge

volumes:
  mysql-data:
