services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electoral-app
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - ./storage:/var/www/example/storage
      - ./bootstrap/cache:/var/www/example/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-electoral}
      - DB_USERNAME=${DB_USERNAME:-electoral}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1. Limpieza de emergencia de la caché fantasma
        echo "Limpiando archivos de caché antiguos..."
        rm -rf bootstrap/cache/*.php

        # 2. Asegurar estructura de carpetas y permisos
        mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions storage/logs bootstrap/cache

        # Ajustamos permisos de todo el proyecto para Unit
        chown -R unit:unit /var/www/example
        chmod -R 775 storage bootstrap/cache

        # 3. Purga y Optimización de Laravel
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        php artisan package:discover --ansi

        echo "Iniciando Nginx Unit..."
        exec unitd --no-daemon --control unix:/var/run/control.unit.sock
    networks:
      - electoral-net

  mysql:
    image: mysql:8.0
    container_name: electoral-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_DATABASE=${DB_DATABASE:-electoral}
      - MYSQL_USER=${DB_USERNAME:-electoral}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - electoral-net

  redis:
    image: redis:alpine
    container_name: electoral-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - electoral-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: electoral-phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - electoral-net

volumes:
  mysql-data:
  redis-data:

networks:
  electoral-net:
    driver: bridge
